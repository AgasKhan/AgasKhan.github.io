# Project metadata (manual).
#
# Fields:
#   listed          -> shows the project in the /projects/ listing + home preview.
#   case_study      -> adds a "read case study" link to the listing row.
#   repo_visibility -> "public" links the repo; "private" shows a "private repo" label.
#                      (A project can be listed with a private repo — the write-up is the public artifact.)
#   short.{es,en}   -> one-line summary per language.
# Detail pages live at /es/projects/<id>/ and /en/projects/<id>/ (mirrored es/ + en/ markdown).
# NOTE: <id> is a PUBLIC-SAFE slug. For NDA/client work it never encodes the client name.

